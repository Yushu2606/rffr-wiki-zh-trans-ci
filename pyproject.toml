[project]
name = "wiki-translate-ci"
version = "1.0.0"
description = "AI translation pipeline for Wiki via GitHub Actions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
wiki-translate = "wiki_translate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_translate"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
